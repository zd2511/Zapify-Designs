<!doctype html><html lang="en-ZA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zapify AI — Business Assistant Concept</title><link rel="stylesheet" href="../css/site.css"></head><body><header class="site-header"><div class="nav"><a class="brand" href="../index.html"><span class="brand-script">Zapify<span>♡</span></span><span class="brand-rule"><i></i><b>DESIGNS</b><i></i></span></a><a class="btn btn-pink" href="../contact.html?service=AI">Want us to build it?</a></div></header><main><section class="page-hero"><div class="wrap"><span class="eyebrow">Zapify AI</span><h1>Turn a business idea into a digital plan.</h1><p class="lead">A frontend concept for an AI business assistant. This version uses a structured local generator; a real AI API can be connected later without changing the interface.</p></div></section><section class="section"><div class="wrap"><div class="tool-shell"><div class="appbar"><b>Zapify AI</b><span>Local concept mode</span></div><div style="padding:24px"><label for="idea"><b>Tell Zapify what you need</b></label><textarea id="idea" rows="4" style="width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;margin:10px 0" placeholder="I'm a hairdresser in Vanderbijlpark. I need more clients."></textarea><button class="btn btn-pink" id="generate">Generate plan</button><div id="aiOut" class="grid grid-3" style="margin-top:20px"></div></div></div></div></section></main><script>const out=document.getElementById('aiOut');document.getElementById('generate').onclick=()=>{const idea=document.getElementById('idea').value.trim()||'a local business that wants more customers';const business=idea.split(' ').slice(0,8).join(' ');out.innerHTML=[['Website structure',`Home · Services · About · Results · Contact · WhatsApp CTA for ${business}`],['Homepage copy','Clear promise + local context + proof + service benefits + strong enquiry CTA.'],['Services','Primary service · supporting service · package/service area · enquiry action.'],['SEO keywords','web design + local service + location variations; service-specific long tails; question queries.'],['Meta description','A concise description matching the service, location and reason to contact the business.'],['Google Business suggestions','Complete categories, services, photos, hours, service area and consistent contact details.'],['Social captions','Problem → useful tip → proof/example → invitation to enquire.'],['CTA ideas','Get a Quote · Book a Call · WhatsApp Us · Request an Estimate']].map(([t,d])=>`<article class="service"><span class="eyebrow">Generated</span><h3>${t}</h3><p>${d}</p></article>`).join('')+'<div class="field full"><a class="btn btn-pink" href="../contact.html?service=AI">Want us to build it?</a></div>'};</script><script src="../js/site.js"></script></body></html>
