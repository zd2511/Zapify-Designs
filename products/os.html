<!doctype html><html lang="en-ZA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zapify OS — Business Platform Concept</title><link rel="stylesheet" href="../css/site.css"></head><body><header class="site-header"><div class="nav"><a class="brand" href="../index.html"><span class="brand-script">Zapify<span>♡</span></span><span class="brand-rule"><i></i><b>DESIGNS</b><i></i></span></a><a class="btn btn-pink" href="../projects.html">Projects</a></div></header><main><section class="page-hero"><div class="wrap"><span class="eyebrow">Product concept · Zapify OS</span><h1>Your business, one workspace.</h1><p class="lead">Zapify OS is a conceptual mini business platform — not an operating system. Explore a working dashboard prototype below.</p></div></section><section class="section"><div class="wrap"><div class="app-shell"><div class="appbar"><b>Zapify OS</b><span id="live">● Local prototype</span></div><div class="app-body"><aside class="sidebar" id="osNav"></aside><div class="dashboard"><div class="dash-cards" id="stats"></div><div class="dash-big" id="view"></div></div></div></div></div></section></main><script>
const data={Overview:{title:'Business overview',html:`<h2>Good morning 👋</h2><p class="muted">Here is what is happening across your business.</p><div class="grid grid-3"><div class="service"><b>R 18,420</b><p>This month's revenue</p></div><div class="service"><b>34</b><p>Open enquiries</p></div><div class="service"><b>12</b><p>Bookings this week</p></div></div>`},Customers:{title:'Customers',html:`<h2>Customers</h2><table class="table"><tr><th>Name</th><th>Status</th><th>Last contact</th></tr><tr><td>Thandi M.</td><td>Active</td><td>Today</td></tr><tr><td>Vaal Auto</td><td>Lead</td><td>Yesterday</td></tr><tr><td>Studio 21</td><td>Active</td><td>3 days ago</td></tr></table>`},Quotes:{title:'Quotes',html:`<h2>Quotes</h2><p class="muted">Draft, send and track customer quotes.</p><button class="btn btn-pink" onclick="alert('New quote form opened in the prototype.')">+ New Quote</button>`},Invoices:{title:'Invoices',html:`<h2>Invoices</h2><p class="muted">Create and track invoices.</p><button class="btn btn-pink" onclick="alert('Invoice builder opened in the prototype.')">+ New Invoice</button>`},Bookings:{title:'Bookings',html:`<h2>Bookings</h2><input type="date" id="bookDate" style="padding:12px;border:1px solid #ddd;border-radius:10px"><p id="bookResult" class="muted">Choose a date to see availability.</p>`},Products:{title:'Products',html:`<h2>Products</h2><div class="grid grid-3"><div class="service"><b>Website Package</b><p>From R800</p></div><div class="service"><b>Design Pack</b><p>Digital product</p></div><div class="service"><b>Template</b><p>Ready-made website</p></div></div>`},Website:{title:'Website',html:`<h2>Website</h2><p class="muted">A central place for domain, pages, SEO and deployment status.</p><div class="service"><b>SSL</b><p>Ready</p></div>`},Marketing:{title:'Marketing',html:`<h2>Marketing</h2><p class="muted">Campaigns, social content and lead sources in one place.</p><button class="btn btn-pink" onclick="alert('Campaign composer opened in the prototype.')">Create Campaign</button>`},Settings:{title:'Settings',html:`<h2>Settings</h2><label>Business name <input value="Your Business" style="padding:10px;margin:8px;border:1px solid #ddd;border-radius:8px"></label><button class="btn btn-dark" onclick="alert('Settings saved locally for this prototype.')">Save settings</button>`}};
const nav=document.getElementById('osNav');Object.keys(data).forEach((k,i)=>{const b=document.createElement('button');b.textContent=k;b.className=i?'':'active';b.onclick=()=>show(k,b);nav.appendChild(b)});function show(k,b){document.querySelectorAll('#osNav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('view').innerHTML=data[k].html;if(k==='Bookings')document.getElementById('bookDate').onchange=e=>document.getElementById('bookResult').textContent=`Prototype calendar: ${e.target.value} selected.`}show('Overview',nav.firstChild);document.getElementById('stats').innerHTML=['Revenue','Customers','Quotes','Bookings'].map((x,i)=>`<div class="dash-card"><small>${x}</small><h3>${['R18,420','126','34','12'][i]}</h3></div>`).join('');
</script><script src="../js/site.js"></script></body></html>
