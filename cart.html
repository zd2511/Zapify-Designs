<!doctype html><html lang="en-ZA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cart | Zapify Designs</title><meta name="robots" content="noindex"><link rel="stylesheet" href="css/site.css"><style>.cart{max-width:1000px;margin:auto}.cart-item{display:grid;grid-template-columns:1fr auto;gap:20px;padding:20px;border:1px solid #ddd;border-radius:16px;margin:12px 0;background:#fff}.cart-total{font-size:1.6rem;font-weight:900;text-align:right}.empty{padding:40px;text-align:center;background:#fff;border-radius:18px}.remove{border:0;padding:8px 12px;border-radius:8px;cursor:pointer}@media(max-width:650px){.cart-item{grid-template-columns:1fr}}</style></head><body><header class="site-header"><div class="nav"><a class="brand" href="index.html"><span class="brand-script">Zapify<span>♡</span></span><span class="brand-rule"><i></i><b>DESIGNS</b><i></i></span></a><nav class="navlinks"><a href="index.html">Home</a><a href="products/templates.html">Templates</a><a href="services.html">Services</a></nav></div></header><main><section class="page-hero"><div class="wrap"><span class="eyebrow">Your cart</span><h1>Review your customised templates.</h1><p class="lead">Every item stores its template, selected add-ons, customization and calculated total. No mysterious arithmetic performed by a cursed spreadsheet.</p></div></section><section class="section"><div class="wrap cart"><div id="items"></div><div id="total" class="cart-total"></div><div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px"><a class="btn btn-dark" href="products/templates.html">Continue shopping</a><button class="btn btn-pink" id="checkout" type="button">Checkout selected item</button></div><p id="status" class="small"></p></div></section></main><script>const itemsEl=document.getElementById('items'),totalEl=document.getElementById('total'),statusEl=document.getElementById('status');let cart=[];try{cart=JSON.parse(localStorage.getItem('zapifyCart')||'[]')}catch{}function render(){if(!cart.length){itemsEl.innerHTML='<div class="empty"><h2>Your cart is empty.</h2><p>Pick a template and customise it first.</p><a class="btn btn-pink" href="products/templates.html">Browse templates</a></div>';totalEl.textContent='';return}itemsEl.innerHTML=cart.map((x,i)=>`<article class="cart-item"><div><span class="eyebrow">${x.template}</span><h2>${x.name}</h2><p>${(x.features||[]).map(f=>f.name+' +R'+f.price).join(' · ')||'No paid add-ons'}</p><button class="remove" data-remove="${i}">Remove</button></div><strong>R${x.total}</strong></article>`).join('');totalEl.textContent='Total: R'+cart.reduce((s,x)=>s+x.total,0);document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{cart.splice(+b.dataset.remove,1);localStorage.setItem('zapifyCart',JSON.stringify(cart));render()})}document.getElementById('checkout').onclick=()=>{if(!cart.length){statusEl.textContent='Your cart is empty.';return}sessionStorage.setItem('zapifyTemplateOrder',JSON.stringify(cart[cart.length-1]));location.href='checkout.html'};render();</script></body></html>
