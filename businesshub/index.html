<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zapify BusinessHub | Business Dashboard</title>
<meta name="description" content="Zapify BusinessHub — interactive business dashboard with invoices, quotes, customers, expenses, budgets, calculators and downloadable PDFs.">
<link rel="stylesheet" href="businesshub.css">
</head>
<body>
<div class="bh-shell">
<aside class="bh-sidebar" id="sidebar">
  <a class="bh-brand" href="../index.html"><span>Zapify</span><b>BUSINESSHUB</b></a>
  <div class="workspace"><span class="workspace-dot"></span><div><strong>My workspace</strong><small>Saved in this browser</small></div></div>
  <nav id="sideNav" aria-label="BusinessHub navigation">
    <button data-view="dashboard" class="active">⌂ <span>Dashboard</span></button>
    <button data-view="invoices">▤ <span>Invoices</span></button>
    <button data-view="quotes">◫ <span>Quotes</span></button>
    <button data-view="customers">◎ <span>Customers</span></button>
    <button data-view="expenses">− <span>Expenses</span></button>
    <button data-view="budget">▥ <span>Budget</span></button>
    <button data-view="calculator">∑ <span>Calculator</span></button>
    <button data-view="settings">⚙ <span>Business settings</span></button>
  </nav>
  <div class="sidebar-bottom"><a href="../index.html">← Zapify Designs</a><button id="resetData">Reset workspace</button></div>
</aside>
<main class="bh-main">
<header class="bh-topbar"><div class="top-left"><button class="mobile-menu" id="mobileMenu">☰</button><div><div class="crumb">BusinessHub / <span id="viewLabel">Dashboard</span></div><h1 id="pageTitle">Business dashboard</h1></div></div><div class="top-actions"><span class="save-state" id="saveState">● Saved locally</span></div></header>
<section id="app"></section>
</main></div>
<div id="modal" class="modal" aria-hidden="true"><div class="modal-card"><button class="modal-close" id="modalClose">×</button><div id="modalContent"></div></div></div>
<div id="toast" class="toast" role="status"></div>
<script src="businesshub.js"></script><script src="../js/site.js"></script>
</body></html>
