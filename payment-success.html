<!doctype html><html lang="en-ZA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your Zapify Website Download</title><link rel="stylesheet" href="css/site.css"><style>.download-page{min-height:75vh;background:#f8f8fa}.download-card{max-width:800px;margin:60px auto;background:#fff;padding:40px;border:1px solid #e7e7ea;box-shadow:0 20px 60px rgba(0,0,0,.08)}.status{padding:15px;background:#f1fff7;border-left:4px solid #2e9d63;margin:20px 0}.warn{padding:15px;background:#fff5df;border-left:4px solid #d49c2c;margin:20px 0}.actions{display:flex;gap:12px;flex-wrap:wrap}</style></head><body><header class="site-header"><div class="nav"><a class="brand" href="index.html"><span class="brand-script">Zapify<span>♡</span></span><span class="brand-rule"><i></i><b>DESIGNS</b></i></span></a></div></header><main class="download-page"><div class="download-card"><span class="eyebrow">Payment complete</span><h1>Your website is ready.</h1><div id="message" class="status">Preparing your personalised website package…</div><div class="actions"><button class="btn btn-pink" id="download" disabled>Build ZIP</button><a class="btn btn-dark" href="products/templates.html">Back to templates</a></div><p class="small">The ZIP includes your website and <b>website setup.pdf</b>, with GitHub Pages, Afrihost domain and support instructions.</p></div></main><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script><script>
const params=new URLSearchParams(location.search);const approved=params.get('status')==='approved';const msg=document.getElementById('message'),btn=document.getElementById('download');let order=null;try{order=JSON.parse(sessionStorage.getItem('zapifyTemplateOrder')||localStorage.getItem('zapifyTemplatePreview')||'null')}catch(e){}
if(!approved){msg.className='warn';msg.innerHTML='<b>Waiting for payment confirmation.</b><br>This page is the success/return destination for the payment gateway. A real gateway must redirect here with a verified approved transaction before the ZIP is released.'}
else if(!order){msg.className='warn';msg.textContent='Payment was marked approved, but the customised order details are not available in this browser session.'}
else{btn.disabled=false;btn.textContent='Download my website ZIP';btn.onclick=buildZip;}
async function buildZip(){btn.disabled=true;btn.textContent='Building ZIP…';try{const t=order.template||'salon';const templateHtml=await fetch('templates/'+t+'.html').then(r=>r.text());const css=await fetch('templates/template.css').then(r=>r.text());const pdf=await fetch('assets/website%20setup.pdf').then(r=>r.blob());const doc=new DOMParser().parseFromString(templateHtml,'text/html');const business=order.businessName||order.business||'Your Business';const headline=order.headline||'Welcome to '+business;const services=order.products||order.services||'Your services and products';const about=order.description||order.about||'Tell your customers what you do and why they should choose your business.';const cta=order.cta||'Get in touch ↗';doc.querySelectorAll('[data-brand]').forEach(e=>e.textContent=business);doc.querySelectorAll('[data-headline]').forEach(e=>e.textContent=headline);doc.querySelectorAll('[data-services]').forEach(e=>e.textContent=services);doc.querySelectorAll('[data-about]').forEach(e=>e.textContent=about);doc.querySelectorAll('[data-cta]').forEach(e=>e.textContent=cta);doc.querySelectorAll('script[src="template-custom.js"]').forEach(e=>e.remove());doc.querySelectorAll('a[href*="contact.html"],a[href*="customize.html"],a[href*="products/templates.html"]').forEach(a=>a.setAttribute('href','#contact'));const footer=doc.querySelector('.footer');if(footer)footer.textContent='© '+business+' · Website setup by Zapify Designs';const preset=(Number(order.preset)||0);const presets={salon:[['#e32976','#fff2f7','#19191f'],['#789b88','#f2f7f2','#18201b'],['#111','#f3f3f3','#111']],mechanic:[['#ffb44c','#0c151b','#fff'],['#ef4b45','#151515','#fff'],['#38bdf8','#08131d','#fff']],restaurant:[['#f5d2aa','#3b1515','#fff'],['#d7d8a0','#273021','#fff'],['#d9b7ff','#171326','#fff']],photographer:[['#fff','#0c1726','#fff'],['#ff7fb8','#24151e','#fff'],['#72a7ff','#0b1630','#fff']],construction:[['#f4c84a','#202a22','#fff'],['#ff7b36','#211812','#fff'],['#63b3ed','#10202c','#fff']],scrapbook:[['#e95f9f','#fff7fb','#2b1e27'],['#e5a72b','#fffaf0','#2b2416'],['#3d8fc7','#f3fbff','#18232b']]};const c=(presets[t]||presets.salon)[preset]||presets.salon[0];doc.documentElement.style.setProperty('--tpl-accent',c[0]);doc.documentElement.style.setProperty('--tpl-bg',c[1]);doc.documentElement.style.setProperty('--tpl-ink',c[2]);const imgs=order.images||[];doc.querySelectorAll('[data-upload-slot]').forEach((el,i)=>{if(imgs[i]){el.textContent='';el.style.backgroundImage='url('+imgs[i]+')';el.style.backgroundSize='cover';el.style.backgroundPosition='center';}});doc.querySelectorAll('title').forEach(e=>e.textContent=business+' — Website');const zip=new JSZip();zip.file('index.html','<!doctype html>\n'+doc.documentElement.outerHTML);zip.file('css/template.css',css);zip.file('website setup.pdf',pdf);if(order.logo){const b64=order.logo.split(',')[1];const ext=(order.logo.match(/^data:image\/(\w+)/)||[])[1]||'png';zip.file('assets/logo.'+ext, b64,{base64:true})}imgs.forEach((data,i)=>{if(data){const parts=data.split(',');zip.file('assets/image-'+(i+1)+'.'+((data.match(/^data:image\/(\w+)/)||[])[1]||'jpg'),parts[1],{base64:true})}});const blob=await zip.generateAsync({type:'blob'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(business.replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'')||'zapify')+'-website.zip';a.click();URL.revokeObjectURL(a.href);msg.innerHTML='<b>Done.</b> Your customised website ZIP has been generated. Keep the PDF booklet with the website files while setting it up.';btn.textContent='Download again';btn.disabled=false}catch(e){console.error(e);msg.className='warn';msg.textContent='The package could not be generated in this browser. Please try again or contact Zapify Designs for support.';btn.disabled=false;btn.textContent='Try again';}}
</script></body></html>
