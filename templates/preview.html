<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;padding:0;min-height:100%;background:#fff}body{overflow-x:hidden}</style></head><body><div id="zapifyPreviewLoading" style="font:600 16px system-ui;padding:32px">Loading template…</div><script>
(async()=>{
 const p=new URLSearchParams(location.search), name=p.get('template')||'salon';
 const allowed=['salon','mechanic','restaurant','photographer','construction','scrapbook'];
 if(!allowed.includes(name)){document.getElementById('zapifyPreviewLoading').textContent='Template not found';return}
 try{
  const bust='?preview='+Date.now();
  const [pageRes,cssRes,jsRes]=await Promise.all([fetch('./'+name+'.html'+bust,{cache:'no-store'}),fetch('./template.css'+bust,{cache:'no-store'}),fetch('./template-custom.js'+bust,{cache:'no-store'})]);
  if(!pageRes.ok||!cssRes.ok||!jsRes.ok) throw new Error('Preview assets unavailable');
  let html=await pageRes.text(), css=await cssRes.text(), js=await jsRes.text();
  html=html.replace(/<script[^>]+src=["']template-custom\.js["'][^>]*><\/script>/ig,'');
  html=html.replace(/<link[^>]+href=["']template\.css["'][^>]*>/ig,'');
  html=html.replace(/<head([^>]*)>/i,'<head$1><style data-zapify-css>'+css.replace(/<\/style/gi,'<\\/style')+'</style>');
  html=html.replace(/<\/body>/i,'<script>'+js.replace(/<\/(script)/gi,'<\\/$1')+'<\/script></body>');
  document.open();document.write(html);document.close();
 }catch(e){document.open();document.write('<!doctype html><body style="font:600 16px system-ui;padding:32px"><h2>Preview unavailable</h2><p>'+String(e.message||e).replace(/[<>]/g,'')+'</p></body>');document.close()}
})();
</script></body></html>
